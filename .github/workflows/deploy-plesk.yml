name: Build and deploy to Plesk

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ledkasa-dist
          path: dist/
          if-no-files-found: error

      - name: Check FTP port on live host
        run: |
          timeout 8 bash -c 'echo >/dev/tcp/ledkasa.com.tr/21' && echo 'ledkasa.com.tr:21 open' || echo 'ledkasa.com.tr:21 closed'

      - name: Deploy dist via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ledkasa.com.tr
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
          timeout: 60000
